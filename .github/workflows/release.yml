name: Release

# The game ships as a Windows .exe (a portable build: one file, no installer).
# Pushing a tag like v0.2.0 builds it and attaches it to a GitHub Release.
# "Run workflow" on the Actions tab builds it without a release and keeps the
# .exe as a downloadable build artifact for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, build the game and package the .exe
        run: npm run dist:win

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: raid-site-2-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(ls release/*.exe | head -n 1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes
          fi
