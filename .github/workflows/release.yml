name: Release

# Pushing a tag like v0.2.0 builds the single-file game and attaches it to a
# GitHub Release. If the release already exists, the asset is replaced.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build the single-file release
        run: npm run release

      - name: Name the asset after the tag
        run: cp dist-release/index.html "raid-site-2-${GITHUB_REF_NAME}.html"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="raid-site-2-${GITHUB_REF_NAME}.html"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes
          fi
